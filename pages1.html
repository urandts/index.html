<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>urandts • Bientôt disponible</title>
  <meta name="description" content="Notre site arrive bientôt. En attendant, visitez notre boutique en ligne urandts.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1a1a1a;
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.08;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 450px;
      height: 450px;
      background: #c9a227;
      top: -150px;
      left: -150px;
    }

    body::after {
      width: 550px;
      height: 550px;
      background: #c9a227;
      bottom: -200px;
      right: -160px;
      opacity: 0.06;
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 780px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(201, 162, 39, 0.25);
      border-radius: 42px;
      padding: 4rem 2.5rem;
      box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(201, 162, 39, 0.05) inset;
      text-align: center;
    }

    .brand {
      display: inline-block;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: #c9a227;
      margin-bottom: 2rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid rgba(201, 162, 39, 0.35);
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.2rem, 9vw, 4rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 1.2rem;
      color: #0a0a0a;
    }

    h1 .accent {
      color: #c9a227;
      display: inline-block;
      position: relative;
      font-style: italic;
    }

    h1 .accent::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 6px;
      width: 100%;
      height: 8px;
      background: rgba(201, 162, 39, 0.2);
      border-radius: 10px;
      z-index: -1;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 400;
      color: #6b6b6b;
      max-width: 560px;
      margin: 0 auto 2.5rem auto;
      padding: 0 0.5rem;
      letter-spacing: 0.01em;
    }

    .shop-button {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1rem 2.2rem;
      background: linear-gradient(135deg, #c9a227, #a88818);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.03em;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -8px rgba(201, 162, 39, 0.6), 0 0 0 1px rgba(201, 162, 39, 0.3) inset;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      margin-bottom: 2.8rem;
    }

    .shop-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px -8px rgba(201, 162, 39, 0.7), 0 0 0 1px rgba(201, 162, 39, 0.4) inset;
    }

    .shop-button:active {
      transform: translateY(-1px);
    }

    .shop-button .arrow {
      display: inline-block;
      transition: transform 0.3s ease;
      font-size: 1.1rem;
    }

    .shop-button:hover .arrow {
      transform: translateX(4px);
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .loader span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #c9a227;
      opacity: 0.4;
      animation: pulse 1.4s infinite ease-in-out both;
    }

    .loader span:nth-child(1) { animation-delay: 0s; }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }
    .loader span:nth-child(4) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.7);
        opacity: 0.25;
        background: #d8c98a;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
        background: #c9a227;
        box-shadow: 0 0 14px rgba(201, 162, 39, 0.5);
      }
    }

    .progress-container {
      max-width: 320px;
      margin: 0 auto 2.5rem auto;
      background: #f0ede4;
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      border: 1px solid rgba(201, 162, 39, 0.15);
    }

    .progress-bar {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, #d8c98a, #c9a227, #a88818);
      border-radius: 100px;
      animation: load 2.4s ease-in-out infinite alternate;
      transform-origin: left;
    }

    @keyframes load {
      0% { width: 20%; opacity: 0.6; }
      50% { width: 75%; opacity: 1; }
      100% { width: 92%; opacity: 0.8; }
    }

    .thanks {
      font-size: 1rem;
      color: #8a8a8a;
      border-top: 1px solid rgba(201, 162, 39, 0.2);
      padding-top: 2rem;
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .thanks p {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .thanks .heart {
      color: #c9a227;
      font-size: 1.2rem;
      animation: beat 1.8s infinite;
      display: inline-block;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.2); }
      50% { transform: scale(1.05); }
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #9a9a9a;
      letter-spacing: 0.05em;
      border-top: 1px solid rgba(201, 162, 39, 0.15);
      padding-top: 1.8rem;
    }

    .footer .year {
      font-weight: 500;
      color: #4a4a4a;
    }

    .footer .brand-small {
      color: #c9a227;
      font-weight: 600;
      letter-spacing: 0.18em;
      margin-left: 0.4rem;
      text-transform: lowercase;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem;
        border-radius: 32px;
      }

      .brand {
        font-size: 1.1rem;
      }

      h1 .accent::after {
        bottom: 4px;
        height: 6px;
      }

      .shop-button {
        padding: 0.9rem 1.8rem;
        font-size: 0.95rem;
        width: 100%;
        justify-content: center;
      }

      .loader span {
        width: 10px;
        height: 10px;
      }

      .thanks p {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">urandts</div>

    <h1>
      Notre site arrive<br>
      <span class="accent">bientôt&nbsp;!</span>
    </h1>

    <p class="subtitle">
      En attendant, découvrez notre boutique en ligne et nos collections.
    </p>

    <a 
      href="https://urandts-store.youcan.store/" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="shop-button"
    >
      Visiter notre boutique
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <div class="loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="progress-container" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>

    <div class="thanks">
      <p>
        Merci pour votre patience
        <span class="heart" aria-hidden="true">❤️</span>
      </p>
    </div>

    <footer class="footer">
      &copy; <span class="year">2025</span>
      <span class="brand-small">urandts</span>
    </footer>
  </main>
</body>
</html>
